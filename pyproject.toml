[project]
name = "pr-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shrey Chaturvedi", email = "shrey.chaturvedi@gmail.com" }
]
requires-python = ">=3.14"
dependencies= [
